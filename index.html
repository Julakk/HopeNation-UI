<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HopeCity HUD</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

body {
    background: transparent;
    overflow: hidden;
    height: 100vh;
    display: flex;
    justify-content: flex-start;
    align-items: flex-end;
    padding-left: 24px;
    padding-bottom: 24px;
    font-family: Arial, sans-serif;
}

.hbe-container {
    display: flex;
    flex-direction: row;
    gap: 10px;
    background: rgba(10, 10, 12, 0.75);
    padding: 10px 14px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.1);
    box-shadow:
        0 10px 30px rgba(0,0,0,.8),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.stat-box {
    position: relative;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: rgba(0,0,0,.6);
    border: 1px solid rgba(255,255,255,.08);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.water {
    position: absolute;
    left: -50%;
    width: 200%;
    height: 200%;
    bottom: -210%;
    border-radius: 40%;
    transition: bottom .8s cubic-bezier(.4,0,.2,1);
    animation: wave 4s linear infinite;
    z-index: 1;
}

.water2 {
    position: absolute;
    left: -55%;
    width: 210%;
    height: 210%;
    bottom: -210%;
    border-radius: 38%;
    transition: bottom 1s cubic-bezier(.4,0,.2,1);
    animation: wave 6s linear infinite;
    opacity: .6;
    z-index: 2;
}

@keyframes wave {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.icon {
    position: relative;
    z-index: 10;
    font-size: 16px;
    color: white;
    text-shadow: 0 2px 4px rgba(0,0,0,.9);
}

.hp .water,
.hp .water2 {
    background: #ff3b30;
    box-shadow: 0 0 10px #ff3b30;
}

.armor .water,
.armor .water2 {
    background: #8e8e93;
    box-shadow: 0 0 10px #8e8e93;
}

.hunger .water,
.hunger .water2 {
    background: #ff9500;
    box-shadow: 0 0 10px #ff9500;
}

.thirst .water,
.thirst .water2 {
    background: #007aff;
    box-shadow: 0 0 10px #007aff;
}
</style>
</head>

<body>

<div class="hbe-container">

    <div class="stat-box hp">
        <div class="water" id="hp-w1"></div>
        <div class="water2" id="hp-w2"></div>
        <div class="icon">♥</div>
    </div>

    <div class="stat-box armor" id="armor-container">
        <div class="water" id="armor-w1"></div>
        <div class="water2" id="armor-w2"></div>
        <div class="icon">◆</div>
    </div>

    <div class="stat-box hunger">
        <div class="water" id="hunger-w1"></div>
        <div class="water2" id="hunger-w2"></div>
        <div class="icon">🍴</div>
    </div>

    <div class="stat-box thirst">
        <div class="water" id="thirst-w1"></div>
        <div class="water2" id="thirst-w2"></div>
        <div class="icon">●</div>
    </div>

</div>

<script>
function updateLevel(id, value) {
    const w1 = document.getElementById(id + "-w1");
    const w2 = document.getElementById(id + "-w2");

    if (!w1 || !w2) return;

    value = Math.max(0, Math.min(100, Number(value) || 0));

    const bottom = -210 + (value * 1.2);

    w1.style.bottom = bottom + "%";
    w2.style.bottom = (bottom + 2) + "%";
}

function updateHBE(hp, armor, hunger, thirst) {
    updateLevel("hp", hp);
    updateLevel("armor", armor);
    updateLevel("hunger", hunger);
    updateLevel("thirst", thirst);

    const armorBox = document.getElementById("armor-container");

    if (armorBox) {
        armorBox.style.opacity = armor <= 1 ? "0.4" : "1";
    }
}

/*
 * CEF event dari Pawn:
 *
 * CEF_EmitEvent(
 *     playerid,
 *     9001,
 *     "updateHBE",
 *     CEF_INT(hp),
 *     CEF_INT(armor),
 *     CEF_INT(hunger),
 *     CEF_INT(thirst)
 * );
 */
if (typeof cef !== "undefined" && cef.on) {
    cef.on("updateHBE", function(hp, armor, hunger, thirst) {
        updateHBE(hp, armor, hunger, thirst);
    });
}

updateHBE(100, 100, 100, 100);
</script>

</body>
</html>
