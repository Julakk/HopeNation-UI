<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HopeCity HUD</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

.hbe-container {
    position: fixed;
    left: 24px;
    bottom: 24px;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 8px 10px;

    background: rgba(8, 10, 13, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 12px;

    box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);

    z-index: 100;
}

.stat-box {
    position: relative;

    width: 38px;
    height: 38px;

    overflow: hidden;

    border-radius: 9px;
    background: rgba(0, 0, 0, 0.58);
    border: 1px solid rgba(255, 255, 255, 0.08);

    display: flex;
    align-items: center;
    justify-content: center;
}

.water,
.water2 {
    position: absolute;

    left: -50%;
    width: 200%;
    height: 200%;

    bottom: -210%;

    border-radius: 40%;

    transition: bottom 0.45s cubic-bezier(.4,0,.2,1);

    animation: wave 4s linear infinite;
}

.water {
    z-index: 1;
}

.water2 {
    left: -55%;
    width: 210%;
    height: 210%;

    opacity: 0.45;
    z-index: 2;

    animation-duration: 6s;
}

@keyframes wave {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}

.icon {
    position: relative;
    z-index: 10;

    font-size: 17px;
    color: #fff;

    text-shadow: 0 2px 5px rgba(0,0,0,.95);
}

.hp .water,
.hp .water2 {
    background: #ff3b30;
    box-shadow: 0 0 12px rgba(255,59,48,.55);
}

.armor .water,
.armor .water2 {
    background: #b8bdc7;
    box-shadow: 0 0 12px rgba(184,189,199,.40);
}

.hunger .water,
.hunger .water2 {
    background: #ff9500;
    box-shadow: 0 0 12px rgba(255,149,0,.50);
}

.thirst .water,
.thirst .water2 {
    background: #0a84ff;
    box-shadow: 0 0 12px rgba(10,132,255,.55);
}

.hud-frame {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    border: 0;
    background: transparent;

    pointer-events: none;
    overflow: hidden;
}

.logo-frame {
    z-index: 110;
}

.stats-frame {
    z-index: 105;
}

.speed-frame {
    z-index: 95;
}

.hud-hidden {
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
}
</style>
</head>

<body class="hud-hidden">

<!-- HBE BARU -->
<div class="hbe-container">

    <div class="stat-box hp">
        <div class="water" id="hp-w1"></div>
        <div class="water2" id="hp-w2"></div>
        <div class="icon">♥</div>
    </div>

    <div class="stat-box armor" id="armor-container">
        <div class="water" id="armor-w1"></div>
        <div class="water2" id="armor-w2"></div>
        <div class="icon">◆</div>
    </div>

    <div class="stat-box hunger">
        <div class="water" id="hunger-w1"></div>
        <div class="water2" id="hunger-w2"></div>
        <div class="icon">🍴</div>
    </div>

    <div class="stat-box thirst">
        <div class="water" id="thirst-w1"></div>
        <div class="water2" id="thirst-w2"></div>
        <div class="icon">●</div>
    </div>

</div>

<!-- UI LAIN -->
<iframe class="hud-frame logo-frame" src="logoserver.html"></iframe>
<iframe class="hud-frame speed-frame" src="speedo.html"></iframe>
<iframe class="hud-frame stats-frame" src="statsinfo.html"></iframe>

<script>
function updateLevel(id, value) {
    const w1 = document.getElementById(id + "-w1");
    const w2 = document.getElementById(id + "-w2");

    if (!w1 || !w2) return;

    value = Math.max(0, Math.min(100, Number(value) || 0));

    const bottom = -210 + (value * 1.2);

    w1.style.bottom = bottom + "%";
    w2.style.bottom = (bottom + 2) + "%";
}

function updateHBE(hp, armor, hunger, thirst) {
    updateLevel("hp", hp);
    updateLevel("armor", armor);
    updateLevel("hunger", hunger);
    updateLevel("thirst", thirst);

    const armorBox = document.getElementById("armor-container");

    if (armorBox) {
        armorBox.style.opacity = armor <= 1 ? "0.4" : "1";
    }
}

function getHudFrame(selector) {
    const frame = document.querySelector(selector);

    if (!frame || !frame.contentWindow) {
        return null;
    }

    return frame.contentWindow;
}

if (typeof cef !== "undefined" && cef.on) {

    cef.on("showHUD", function() {
        document.body.classList.remove("hud-hidden");
    });

    cef.on("hideHUD", function() {
        document.body.classList.add("hud-hidden");
    });

    cef.on("updateHBE", function(hp, armor, hunger, thirst) {
        updateHBE(hp, armor, hunger, thirst);
    });

    cef.on("updateSpeedo", function(data) {
        const frame = getHudFrame(".speed-frame");

        if (frame && typeof frame.updateSpeedometer === "function") {
            frame.updateSpeedometer(data);
        }
    });

    cef.on("hideSpeedo", function() {
        const frame = getHudFrame(".speed-frame");

        if (frame && typeof frame.hideSpeedometer === "function") {
            frame.hideSpeedometer();
        }
    });

    cef.on("updatePlayerInfo", function(data) {
        const frame = getHudFrame(".stats-frame");

        if (frame && typeof frame.updatePlayerInfo === "function") {
            frame.updatePlayerInfo(data);
        }
    });
}

updateHBE(100, 100, 100, 100);
</script>

</body>
</html>
