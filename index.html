<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ATY HUD - Water Level Dark</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: transparent;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: flex-start; 
            align-items: flex-end;
            height: 100vh;
            padding-left: 24px;
            padding-bottom: 24px;
        }

        /* =========================================
           CONTAINER UTAMA (MODERN DARK GLASS)
           ========================================= */
        .hbe-container {
            display: flex;
            flex-direction: row; 
            gap: 10px;
            
            /* HITAM MODERN: Transparan gelap dengan blur */
            background: rgba(10, 10, 12, 0.75);
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
            
            padding: 10px 14px;
            border-radius: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 
                0 10px 30px rgba(0, 0, 0, 0.8), 
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* =========================================
           KOTAK IKON (WADAH AIR)
           ========================================= */
        .stat-box {
            position: relative;
            width: 32px; /* Sedikit dibesarkan agar proporsional */
            height: 32px;
            border-radius: 8px;
            
            /* Background dalam kotak lebih gelap */
            background-color: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateZ(0); 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        /* =========================================
           EFEK AIR BERGELOMBANG
           ========================================= */
        .water {
            position: absolute;
            left: -50%;
            width: 200%;
            height: 200%;
            bottom: -210%; 
            border-radius: 40%; 
            transition: bottom 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            animation: waveAnimation 4s linear infinite; 
            z-index: 1;
        }

        .water-secondary {
            position: absolute;
            left: -55%;
            width: 210%;
            height: 210%;
            bottom: -210%;
            border-radius: 38%;
            transition: bottom 1s cubic-bezier(0.4, 0, 0.2, 1);
            animation: waveAnimation 6s linear infinite;
            opacity: 0.6;
            z-index: 2;
        }

        @keyframes waveAnimation {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Ikon di Atas Air */
        .icon {
            position: relative;
            z-index: 10;
            font-size: 14px; /* Ikon sedikit diperbesar */
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9); /* Shadow lebih tegas */
            pointer-events: none;
        }

        /* =========================================
           WARNA AIR (Vibrant Glow)
           ========================================= */
        .hp .water, .hp .water-secondary { background: #ff3b30; box-shadow: 0 0 10px #ff3b30; }
        .armor .water, .armor .water-secondary { background: #8e8e93; box-shadow: 0 0 10px #8e8e93; }
        .hunger .water, .hunger .water-secondary { background: #ff9500; box-shadow: 0 0 10px #ff9500; }
        .thirst .water, .thirst .water-secondary { background: #007aff; box-shadow: 0 0 10px #007aff; }
        .bladder .water, .bladder .water-secondary { background: #34c759; box-shadow: 0 0 10px #34c759; }

        .value-text {
            display: none; 
        }
    </style>
</head>
<body>

    <div class="hbe-container">
        <!-- Health -->
        <div class="stat-box hp">
            <div class="water" id="hp-w1"></div>
            <div class="water-secondary" id="hp-w2"></div>
            <i class="fa-solid fa-heart icon"></i>
        </div>

        <!-- Armor -->
        <div class="stat-box armor" id="armor-container">
            <div class="water" id="armor-w1"></div>
            <div class="water-secondary" id="armor-w2"></div>
            <i class="fa-solid fa-shield-halved icon"></i>
        </div>

        <!-- Hunger -->
        <div class="stat-box hunger">
            <div class="water" id="hunger-w1"></div>
            <div class="water-secondary" id="hunger-w2"></div>
            <i class="fa-solid fa-utensils icon"></i>
        </div>

        <!-- Thirst -->
        <div class="stat-box thirst">
            <div class="water" id="thirst-w1"></div>
            <div class="water-secondary" id="thirst-w2"></div>
            <i class="fa-solid fa-droplet icon"></i>
        </div>

        <!-- Bladder -->
        <div class="stat-box bladder">
            <div class="water" id="bladder-w1"></div>
            <div class="water-secondary" id="bladder-w2"></div>
            <i class="fa-solid fa-toilet icon"></i>
        </div>
    </div>

    <script>
        function updateLevel(idPrefix, percent) {
            const w1 = document.getElementById(idPrefix + '-w1');
            const w2 = document.getElementById(idPrefix + '-w2');
            
            if (!w1 || !w2) return;

            const finalBottom = -210 + (percent * 1.2);

            w1.style.bottom = finalBottom + "%";
            w2.style.bottom = (finalBottom + 2) + "%"; 
        }

        function updateHBE(data) {
            console.log("Menerima data:", data); 
            const parts = data.split('|');
            if (parts.length < 5) return;

            const hp = Math.max(0, Math.min(100, parseFloat(parts[0]) || 0));
            const armor = Math.max(0, Math.min(100, parseFloat(parts[1]) || 0));
            const lapar = Math.max(0, Math.min(100, parseFloat(parts[2]) || 0));
            const haus = Math.max(0, Math.min(100, parseFloat(parts[3]) || 0));
            const kencing = Math.max(0, Math.min(100, parseFloat(parts[4]) || 0));

            updateLevel('hp', hp);
            updateLevel('armor', armor);
            updateLevel('hunger', lapar);
            updateLevel('thirst', haus);
            updateLevel('bladder', kencing);

            const armorContainer = document.getElementById('armor-container');
            if (armorContainer) {
                if (armor <= 1) {
                    armorContainer.style.opacity = '0.4';
                } else {
                    armorContainer.style.opacity = '1';
                }
            }
        }

        if (typeof cef !== "undefined" && cef.on) {
            cef.on("updateHBE", function(data) {
                updateHBE(data);
            });
        }
    </script>
</body>
</html>
